<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <h1 class="title">Smart Expense Tracker</h1>

    <form id="expense-form">
        <label for ="expense-name">Expense Name:</label>
        <input type="text" id="expense-name" name="expense" required>
        <span id="nameerror"></span>

        <label for="expense-amount">Amount:</label>
        <input type="number" id="expense-amount" name="amount" step="1" min="0" required>
        <span id="amounterror"></span>

      <label for="expense-date">Date:</label>
        <input type="date" id="expense-date" name="date" required>
        <span id="dateerror"></span>

        <label for="expense-category">Category:</label>
        <select id="expense-category" name="category" >
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="shopping">Shopping</option>
            <option value="bills">Bills</option>
            <option value="other">Other</option>
        </select>   

       
        <button type="submit" id="submit-btn">Add Expense</button>
        <button type="button" id="cancel-btn" hidden>Cancel Edit</button>
        
       
      </form>
      

    <h2>Expenses</h2>
     <label for="filter-category">Filter Category:</label>
        <select id="filter-category" name="category">
            <option value="all"  selected>--All Categories--</option>  
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="shopping">Shopping</option>
            <option value="bills">Bills</option>
            <option value="other">Other</option>
        </select> 
    <ul id="expense-list"></ul>

    <h3>Total Expenses: ₹<span id="total-amount">0</span></h3>
    </div>

      <script src="script.js"></script>
</body>
</html>
